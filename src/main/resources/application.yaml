server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}

      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:60000}
      initialization-fail-timeout: 60000

      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}

      # Postgres ждёт блокировку SELECT ... FOR UPDATE бесконечно,
      # lock_timeout ограничивает ожидание: по истечении клиент получает 409.
      data-source-properties:
        options: -c lock_timeout=${LOCK_TIMEOUT_MS:3000}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
