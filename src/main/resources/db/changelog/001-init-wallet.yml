databaseChangeLog:

  - changeSet:
      id: 001-create-wallet
      author: postgres
      changes:
        - createTable:
            tableName: wallets
            columns:
              - column:
                  name: vallet_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: amount
                  type: numeric(19,2)
                  constraints:
                    nullable: false